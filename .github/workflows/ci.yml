name: Pintika CI & Auto-Build Pipeline

on:
  push:
    branches: [ "v1.0_dev", "main" ]
  pull_request:
    branches: [ "v1.0_dev", "main" ]

jobs:
  test-and-build:
    name: Run Unit Tests & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Execute Vitest Suite (Gatekeeper)
        run: npx vitest run

      - name: Verify Production Build
        run: npm run build
